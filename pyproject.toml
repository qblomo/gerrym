[project]
name = "gerrym"
version = "0.1.0"
description = "Analysis of gerrymendering"
requires-python = ">=3.11"
dependencies = [
    "geopandas",
    "shapely"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-shapely", "types-geopandas"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"